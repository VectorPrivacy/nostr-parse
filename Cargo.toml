[package]
name = "nostr-parse"
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
description = "Fast, strict Nostr event (NIP-01 JSON) parser: owned, one allocation, in place, or unsigned (NIP-59 rumors)"
license = "MIT"
readme = "README.md"
keywords = ["nostr", "json", "parser", "nip-01"]
categories = ["parser-implementations", "encoding"]
repository = "https://github.com/VectorPrivacy/nostr-parse"
exclude = ["bench/"]

[dependencies]

[dev-dependencies]
serde = "1"
serde_json = "1"
# The reference for unsigned events: rust-nostr's own UnsignedEvent::from_json.
nostr = { version = "=0.45.5", default-features = false, features = ["std"] }
# Hashes preimages in the tests and the ids example.
sha2 = "0.11"

[profile.release]
lto = "fat"
codegen-units = 1
